name: Verification loop

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the shared verification loop
        working-directory: examples/typescript-verification-loop
        run: python3 ../../scripts/project-verify.py verify --root . --knowledge-root ../../knowledge
