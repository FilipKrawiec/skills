name: Verify repository

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: python3 -m pip install -r requirements-health.txt
      - run: just verify
      - name: Require a clean worktree
        shell: bash
        run: |
          dirt="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirt" ]; then
            printf '%s\n' "$dirt"
            exit 1
          fi
      # After hygiene: the action writes its report into the workspace, which the hygiene check above treats as dirt.
      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
      - name: Preserve confidence evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: confidence
          path: .health/
          include-hidden-files: true
          if-no-files-found: error

  mutations:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: project-verify
            minimum: 75.60
          - target: validate-plugin-definitions
            minimum: 88.77
          - target: release
            minimum: 81.50
          - target: check-mutation-results
            minimum: 91.66
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.0'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: python3 -m pip install -r requirements-health.txt
      - run: just mutation "${{ matrix.target }}" "${{ matrix.minimum }}"
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutations-${{ matrix.target }}
          path: .health/
          include-hidden-files: true
          if-no-files-found: error

  verify:
    if: always()
    needs: [tests, mutations]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every confidence check
        env:
          TESTS: ${{ needs.tests.result }}
          MUTATIONS: ${{ needs.mutations.result }}
        run: test "$TESTS" = success && test "$MUTATIONS" = success
