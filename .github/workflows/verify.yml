name: Verify repository

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: python3 -m pip install pyyaml
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/validate-plugin-definitions.py
      - name: Require a clean worktree
        shell: bash
        run: |
          dirt="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirt" ]; then
            printf '%s\n' "$dirt"
            exit 1
          fi
      # Last: the action writes its report into the workspace, which the hygiene check above treats as dirt.
      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
