name: Release

# Stable publication is held pending owner approval of the exact release candidate.
# The constant job condition has no manual or variable bypass.
on:
  workflow_run:
    workflows: [Verify repository]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release main
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Bump, commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py
      - name: Push and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
          if [ -z "${tag}" ] || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Nothing to publish."
            exit 0
          fi
          git push --atomic origin HEAD:main "refs/tags/${tag}"
          gh release create "${tag}" -R "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${tag}"
