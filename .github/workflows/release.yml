name: Release

# Every verified push to main is released: the workflow CLI bumps the version from conventional
# commits since the last tag, syncs the manifests, commits them on main and tags that commit, so
# main's manifests always equal the newest tag. main and the tag are pushed atomically and
# fast-forward only (never forced): if main moved meanwhile nothing is published and the next
# verified push releases. The bump commit's own run finds the tag at HEAD and releases nothing.
# The release branch is moved to the newest tag for consumers that still follow it. RELEASE_TOKEN,
# an admin's fine-grained token with contents write on this repository, pushes main, the branch
# and the v* tag past their rulesets.
on:
  workflow_run:
    workflows: [Verify repository]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Bump, commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node plugins/common/workflow/scripts/workflow.mjs release
      - name: Push and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
          if [ -z "${tag}" ] || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Nothing to publish."
            exit 0
          fi
          if ! git push --atomic origin HEAD:main "refs/tags/${tag}"; then
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" ]; then
              echo "Push to main was rejected although main did not move; failing the run."
              exit 1
            fi
            echo "main moved since this release was cut; nothing published, the next run releases."
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/release"
          gh release create "${tag}" -R "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${tag}"
